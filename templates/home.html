<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FWI Prediction</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0px 0px 10px rgba(0,0,0,0.2);
            width:450px;
        }

        h1{
            text-align:center;
            color:#333;
        }

        input[type="text"]{
            width:100%;
            padding:10px;
            margin:8px 0;
            border:1px solid #ccc;
            border-radius:5px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:10px;
            background:#007bff;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#0056b3;
        }

        .result{
            margin-top:20px;
            text-align:center;
            font-size:20px;
            font-weight:bold;
            color:green;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>FWI Prediction</h1>

    <form action="{{ url_for('predict_datapoint') }}" method="post">

        <input type="text" name="Temperature" placeholder="Temperature" required>

        <input type="text" name="RH" placeholder="Relative Humidity (RH)" required>

        <input type="text" name="Ws" placeholder="Wind Speed (Ws)" required>

        <input type="text" name="Rain" placeholder="Rain" required>

        <input type="text" name="FFMC" placeholder="FFMC" required>

        <input type="text" name="DMC" placeholder="DMC" required>

        <input type="text" name="ISI" placeholder="ISI" required>

        <input type="text" name="Classes" placeholder="Classes (0/1)" required>

        <input type="text" name="Region" placeholder="Region (0/1)" required>

        <button type="submit">Predict</button>

    </form>

    {% if results %}
    <div class="result">
        Predicted FWI: {{ results }}
    </div>
    {% endif %}

</div>

</body>
</html>
